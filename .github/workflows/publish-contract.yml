name: Publish contract package

# The contract package is versioned separately from the app. Push a `contract-v*` tag to pack and
# publish Larik.Data; the app's own `v*` release is unchanged.
#
# Publishing uses Trusted Publishing (OIDC), not a long-lived API key. One-time setup on nuget.org:
#   Account -> Trusted Publishing -> policy
#     Repository Owner: dwifuady
#     Repository:       larik-winui
#     Workflow File:    publish-contract.yml
#     Scope:            push new packages and versions matching Larik.Data
# And in GitHub: Settings -> Secrets and variables -> Actions -> Variables -> NUGET_USER = <profile name>
on:
  push:
    tags: ['contract-v*']
  workflow_dispatch:
    inputs:
      version:
        description: Contract version, without the leading v (for example 1.0.0)
        required: true

permissions:
  contents: read

jobs:
  publish:
    # Windows matches the rest of the repo and avoids cross-platform package-path surprises.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> short-lived nuget.org API key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
              '${{ inputs.version }}'
          } else {
              '${{ github.ref_name }}' -replace '^contract-v', ''
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Version '$version' is not MAJOR.MINOR.PATCH."
          }

          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Publishing Larik.Data $version"

      - name: Pack
        run: >
          dotnet pack Larik.Data/Larik.Data.csproj
          -c Release
          -p:Version=${{ steps.version.outputs.value }}
          -o out

      # Exchange the GitHub OIDC token for a one-hour API key. Request it after packing: the key
      # expires quickly and is single-use.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "out/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Keep the package as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: larik-data-contract
          path: out/*
