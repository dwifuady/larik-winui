<?xml version="1.0" encoding="UTF-8"?>
<!--
  Larik app icon — master source (1024x1024).
  The mark is an L bent from one bar, with three fading rows stacked beside it:
  rows for the "larik" (array / row) in the name, and a letterform that
  survives at 16 px.

  Windows assets are generated from this file with winapp manifest update-assets
  (see Branding/README.md). The unplated 48 px icon is reused for the light theme.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C7BFB"/>
      <stop offset="0.55" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#4B45D9"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#tile)"/>

  <!-- glyph, scaled 110% around the tile centre -->
  <g transform="translate(512 512) scale(1.1) translate(-512 -512)">
    <!-- L: one bar bent with a large outer curve, flat ends -->
    <path d="M 354 268 V 540 Q 354 690 504 690 H 730" fill="none" stroke="#F7F7FB"
          stroke-width="108" stroke-linecap="butt"/>

    <!-- rows: right-aligned to the foot, fading back to keep the L dominant -->
    <g fill="#F7F7FB">
      <rect x="540" y="268" width="190" height="72" rx="36" opacity="0.92"/>
      <rect x="580" y="396" width="150" height="72" rx="36" opacity="0.62"/>
      <rect x="540" y="524" width="190" height="72" rx="36" opacity="0.36"/>
    </g>
  </g>
</svg>
